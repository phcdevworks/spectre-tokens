steps:
  - label: ':node: spectre-tokens verify'
    key: 'verify'
    command:
      - 'node --version'
      - 'git config --global --add safe.directory "$$PWD"'
      - 'npm ci'
      - 'npm run check'
    plugins:
      # The agent's own Node (20.x) is below the build tooling's floor
      # (tsup 9 needs ^22.18.0 || ^24.11.0), so run in a pinned Node image.
      - docker#v5.12.0:
          image: 'node:24'
    agents:
      queue: 'default'
    artifact_paths:
      - 'dist/**/*'
    timeout_in_minutes: 15
